<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="icon" type="image/png" href="logo.png">
    <title>KrakenTech - Admin Users</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font-family: inherit;
        }

        .page {
            min-height: 100vh;
            padding: 25px;
        }

        /* =========================================
           HEADER
        ========================================= */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
            padding: 20px 24px;
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 16px;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
            color: #00ff88;
        }

        .brand p {
            margin: 6px 0 0;
            color: #8d8d8d;
            font-size: 13px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .btn-green {
            background: #00ff88;
            color: #000;
        }

        .btn-dark {
            background: #181818;
            color: #fff;
            border: 1px solid #303030;
        }

        .btn-red {
            background: #ff3b4f;
            color: #fff;
        }

        .btn-blue {
            background: #2684ff;
            color: #fff;
        }

        /* =========================================
           STATUS
        ========================================= */

        .status {
            display: none;
            padding: 13px 16px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-size: 14px;
        }

        .status.success {
            display: block;
            background: rgba(0, 255, 136, 0.10);
            border: 1px solid rgba(0, 255, 136, 0.35);
            color: #00ff88;
        }

        .status.error {
            display: block;
            background: rgba(255, 59, 79, 0.10);
            border: 1px solid rgba(255, 59, 79, 0.35);
            color: #ff6b7a;
        }

        .status.info {
            display: block;
            background: rgba(38, 132, 255, 0.10);
            border: 1px solid rgba(38, 132, 255, 0.35);
            color: #65a7ff;
        }

        /* =========================================
           STATS
        ========================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 14px;
            padding: 20px;
        }

        .stat-title {
            color: #8d8d8d;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 25px;
            font-weight: bold;
        }

        /* =========================================
           MAIN GRID
        ========================================= */

        .main-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 16px;
            overflow: hidden;
        }

        .panel-header {
            padding: 18px 20px;
            border-bottom: 1px solid #242424;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .panel-title {
            font-size: 17px;
            font-weight: bold;
        }

        .panel-body {
            padding: 20px;
        }

        /* =========================================
           SEARCH
        ========================================= */

        .search-box {
            width: 100%;
            background: #161616;
            border: 1px solid #303030;
            color: #fff;
            padding: 13px 15px;
            border-radius: 10px;
            outline: none;
        }

        .search-box:focus {
            border-color: #00ff88;
        }

        /* =========================================
           USERS
        ========================================= */

        .users-list {
            max-height: 650px;
            overflow-y: auto;
        }

        .user-item {
            padding: 16px;
            border-bottom: 1px solid #202020;
            cursor: pointer;
            transition: 0.2s;
        }

        .user-item:hover {
            background: #151515;
        }

        .user-item.active {
            background: rgba(0, 255, 136, 0.07);
            border-left: 3px solid #00ff88;
        }

        .user-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .user-name {
            font-weight: bold;
            font-size: 15px;
        }

        .user-email {
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }

        .user-balance {
            color: #00ff88;
            font-weight: bold;
            white-space: nowrap;
        }

        .user-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 11px;
            background: #191919;
            color: #aaa;
        }

        /* =========================================
           USER DETAILS
        ========================================= */

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        .profile {
            margin-bottom: 20px;
        }

        .profile-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #242424;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #00ff88;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 19px;
            font-weight: bold;
        }

        .profile-email {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        .balance-box {
            margin-top: 20px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 18px;
        }

        .balance-label {
            color: #888;
            font-size: 12px;
        }

        .balance-value {
            font-size: 31px;
            color: #00ff88;
            font-weight: bold;
            margin-top: 6px;
        }

        /* =========================================
           BALANCE CONTROLS
        ========================================= */

        .balance-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .control-card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 15px;
        }

        .control-card h4 {
            margin: 0 0 12px;
            font-size: 14px;
        }

        .amount-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #303030;
            background: #090909;
            color: white;
            outline: none;
            margin-bottom: 10px;
        }

        .amount-input:focus {
            border-color: #00ff88;
        }

        /* =========================================
           TABS
        ========================================= */

        .tabs {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            margin-top: 20px;
            padding-bottom: 5px;
        }

        .tab {
            border: 1px solid #303030;
            background: #151515;
            color: #aaa;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab.active {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
            font-weight: bold;
        }

        .tab-content {
            display: none;
            margin-top: 15px;
        }

        .tab-content.active {
            display: block;
        }

        /* =========================================
           TABLE
        ========================================= */

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th {
            text-align: left;
            color: #777;
            font-weight: normal;
            padding: 11px 8px;
            border-bottom: 1px solid #292929;
            white-space: nowrap;
        }

        td {
            padding: 11px 8px;
            border-bottom: 1px solid #1d1d1d;
            white-space: nowrap;
        }

        .green {
            color: #00ff88;
        }

        .red {
            color: #ff4f62;
        }

        .yellow {
            color: #ffc857;
        }

        .gray {
            color: #888;
        }

        /* =========================================
           LOADING
        ========================================= */

        .loading {
            text-align: center;
            padding: 35px;
            color: #777;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #292929;
            border-top-color: #00ff88;
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 1000px) {

            .main-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 700px) {

            .page {
                padding: 12px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .balance-controls {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 450px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .user-main {
                align-items: flex-start;
                flex-direction: column;
            }

        }

    
        /* KrakenTech Logo Constraints */
        .logo { display: flex !important; align-items: center !important; gap: 10px !important; color: #ff1f1f !important; font-size: 20px !important; font-weight: 800 !important; letter-spacing: 0.5px !important; text-decoration: none !important; }
        .logo-img, .logo img { height: 32px !important; width: 32px !important; max-height: 32px !important; max-width: 32px !important; object-fit: contain !important; border-radius: 50% !important; flex-shrink: 0 !important; vertical-align: middle !important; display: inline-block !important; }
        .auth-logo { display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 8px !important; color: #ff1f1f !important; font-size: 26px !important; font-weight: 800 !important; margin-bottom: 16px !important; text-decoration: none !important; }
        .auth-logo-img, .auth-logo img { height: 48px !important; width: 48px !important; max-height: 48px !important; max-width: 48px !important; object-fit: contain !important; border-radius: 50% !important; display: block !important; margin: 0 auto !important; }

    </style>

</head>


<body>

<div class="page">

    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="topbar">

        <div class="brand">

            <h1>KrakenTech</h1>

            <p>
                Admin User Management
            </p>

        </div>

        <div class="header-buttons">

            <button
                class="btn btn-dark"
                onclick="goBackAdmin()"
            >
                ← Admin Panel
            </button>

            <button
                class="btn btn-green"
                onclick="loadUsers()"
            >
                ↻ Refresh
            </button>

            <button
                class="btn btn-red"
                onclick="logoutAdmin()"
            >
                Logout
            </button>

        </div>

    </div>


    <!-- =========================================
         STATUS
    ========================================== -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- =========================================
         STATS
    ========================================== -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-title">
                Total Users
            </div>

            <div
                id="totalUsers"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Total Balance
            </div>

            <div
                id="totalBalance"
                class="stat-value green"
            >
                $0.00
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Total Deposits
            </div>

            <div
                id="totalDeposits"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-title">
                Total Withdrawals
            </div>

            <div
                id="totalWithdrawals"
                class="stat-value"
            >
                0
            </div>

        </div>

    </div>


    <!-- =========================================
         MAIN
    ========================================== -->

    <div class="main-grid">


        <!-- =====================================
             USERS LIST
        ====================================== -->

        <div class="panel">

            <div class="panel-header">

                <div class="panel-title">
                    All Users
                </div>

            </div>

            <div class="panel-body">

                <input
                    id="searchInput"
                    class="search-box"
                    type="text"
                    placeholder="Search name, email or phone..."
                    oninput="filterUsers()"
                >

            </div>


            <div
                id="usersList"
                class="users-list"
            >

                <div class="loading">

                    <div class="spinner"></div>

                    Loading users...

                </div>

            </div>

        </div>


        <!-- =====================================
             USER DETAILS
        ====================================== -->

        <div class="panel">

            <div class="panel-header">

                <div class="panel-title">
                    User Details
                </div>

            </div>


            <div
                id="userDetails"
                class="panel-body"
            >

                <div class="empty">

                    Select a user from the list.

                </div>

            </div>

        </div>

    </div>

</div>


<script>

    // =====================================================
    // CONFIG
    // =====================================================

    const API_URL = (typeof window !== "undefined" && window.location.protocol.startsWith("http"))
    ? window.location.origin
    : "http://localhost:3000";


    let users = [];

    let selectedUser = null;

    let currentTab = "deposits";


    // =====================================================
    // AUTH
    // =====================================================

    function getToken() {

        const possibleKeys = [

            "tradeXToken",
            "token",
            "authToken",
            "jwtToken",
            "adminToken"

        ];

        for (
            const key of possibleKeys
        ) {

            const value =
                localStorage.getItem(
                    key
                );

            if (value) {

                return value;

            }

        }

        return "";

    }


    function getAdminSecret() {

        const possibleKeys = [

            "tradeXAdminSecret",
            "adminSecret",
            "ADMIN_SECRET"

        ];

        for (
            const key of possibleKeys
        ) {

            const value =
                localStorage.getItem(
                    key
                );

            if (value) {

                return value;

            }

        }

        return "";

    }


    function saveAdminSecret(
        secret
    ) {

        localStorage.setItem(
            "tradeXAdminSecret",
            secret
        );

    }


    // =====================================================
    // ADMIN SECRET
    // =====================================================

    function ensureAdminSecret() {

        let secret =
            getAdminSecret();

        if (secret) {

            return secret;

        }

        secret =
            window.prompt(
                "Enter KrakenTech ADMIN_SECRET:"
            );

        if (
            secret
        ) {

            saveAdminSecret(
                secret
            );

        }

        return secret || "";

    }


    // =====================================================
    // API HEADERS
    // =====================================================

    function getHeaders() {

        const token =
            getToken();

        const secret =
            getAdminSecret();

        return {

            "Content-Type":
                "application/json",

            "Authorization":
                `Bearer ${token}`,

            "x-admin-secret":
                secret

        };

    }


    // =====================================================
    // API REQUEST
    // =====================================================

    async function apiRequest(
        endpoint,
        options = {}
    ) {

        let response;

        try {

            response =
                await fetch(
                    API_URL + endpoint,
                    {

                        ...options,

                        headers: {

                            ...getHeaders(),

                            ...(options.headers || {})

                        }

                    }
                );

        } catch (error) {

            throw new Error(
                "Cannot connect to KrakenTech server. Make sure server.js is running."
            );

        }


        let data = null;

        try {

            data =
                await response.json();

        } catch (error) {

            throw new Error(
                `Server returned invalid response (${response.status}).`
            );

        }


        if (
            !response.ok ||
            data.success === false
        ) {

            throw new Error(

                data.message ||
                `Request failed (${response.status}).`

            );

        }


        return data;

    }


    // =====================================================
    // STATUS
    // =====================================================

    function showStatus(
        message,
        type = "info"
    ) {

        const box =
            document.getElementById(
                "status"
            );

        box.className =
            `status ${type}`;

        box.textContent =
            message;

        box.style.display =
            "block";


        setTimeout(
            () => {

                box.style.display =
                    "none";

            },
            4000
        );

    }


    // =====================================================
    // FORMAT
    // =====================================================

    function money(
        value
    ) {

        const number =
            Number(
                value || 0
            );

        return "$" +
            number.toLocaleString(
                "en-US",
                {

                    minimumFractionDigits:
                        2,

                    maximumFractionDigits:
                        2

                }
            );

    }


    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    function formatDate(
        value
    ) {

        if (!value) {

            return "-";

        }

        const date =
            new Date(
                value
            );

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return value;

        }

        return date.toLocaleString();

    }


    // =====================================================
    // LOAD USERS
    // =====================================================

    async function loadUsers() {

        const list =
            document.getElementById(
                "usersList"
            );


        list.innerHTML = `

            <div class="loading">

                <div class="spinner"></div>

                Loading users...

            </div>

        `;


        try {

            const secret =
                ensureAdminSecret();

            if (!secret) {

                throw new Error(
                    "Admin secret is required."
                );

            }


            if (!getToken()) {

                throw new Error(
                    "Admin login token not found. Login through the Admin Panel first."
                );

            }


            const data =
                await apiRequest(
                    "/users"
                );


            users =
                Array.isArray(
                    data.users
                )
                    ? data.users
                    : [];


            updateStats();

            renderUsers(
                users
            );


            showStatus(
                "Users loaded successfully.",
                "success"
            );


        } catch (error) {

            list.innerHTML = `

                <div class="empty">

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            `;

            showStatus(
                error.message,
                "error"
            );

        }

    }


    // =====================================================
    // STATS
    // =====================================================

    function updateStats() {

        let totalBalance = 0;

        let totalDeposits = 0;

        let totalWithdrawals = 0;


        users.forEach(
            user => {

                totalBalance +=
                    Number(
                        user.balance || 0
                    );


                totalDeposits +=
                    Array.isArray(
                        user.deposits
                    )
                        ? user.deposits.length
                        : 0;


                totalWithdrawals +=
                    Array.isArray(
                        user.withdrawals
                    )
                        ? user.withdrawals.length
                        : 0;

            }
        );


        document.getElementById(
            "totalUsers"
        ).textContent =
            users.length;


        document.getElementById(
            "totalBalance"
        ).textContent =
            money(
                totalBalance
            );


        document.getElementById(
            "totalDeposits"
        ).textContent =
            totalDeposits;


        document.getElementById(
            "totalWithdrawals"
        ).textContent =
            totalWithdrawals;

    }


    // =====================================================
    // RENDER USERS
    // =====================================================

    function renderUsers(
        list
    ) {

        const container =
            document.getElementById(
                "usersList"
            );


        if (
            !list.length
        ) {

            container.innerHTML = `

                <div class="empty">

                    No users found.

                </div>

            `;

            return;

        }


        container.innerHTML =
            list.map(
                user => {

                    const active =
                        selectedUser &&
                        String(
                            selectedUser.id
                        ) ===
                        String(
                            user.id
                        )
                            ? "active"
                            : "";


                    return `

                        <div
                            class="user-item ${active}"
                            onclick="selectUser('${escapeHtml(
                                user.id
                            )}')"
                        >

                            <div class="user-main">

                                <div>

                                    <div class="user-name">

                                        ${escapeHtml(
                                            user.name
                                        )}

                                    </div>

                                    <div class="user-email">

                                        ${escapeHtml(
                                            user.email
                                        )}

                                    </div>

                                </div>

                                <div class="user-balance">

                                    ${money(
                                        user.balance
                                    )}

                                </div>

                            </div>


                            <div class="user-meta">

                                <span class="badge">

                                    ID:
                                    ${escapeHtml(
                                        user.id
                                    )}

                                </span>


                                ${
                                    user.phone
                                        ? `
                                            <span class="badge">
                                                ${escapeHtml(
                                                    user.phone
                                                )}
                                            </span>
                                        `
                                        : ""
                                }


                                <span class="badge">

                                    Deposits:
                                    ${
                                        Array.isArray(
                                            user.deposits
                                        )
                                            ? user.deposits.length
                                            : 0
                                    }

                                </span>


                                <span class="badge">

                                    Withdrawals:
                                    ${
                                        Array.isArray(
                                            user.withdrawals
                                        )
                                            ? user.withdrawals.length
                                            : 0
                                    }

                                </span>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

    }


    // =====================================================
    // SEARCH
    // =====================================================

    function filterUsers() {

        const query =
            document.getElementById(
                "searchInput"
            )
                .value
                .trim()
                .toLowerCase();


        if (!query) {

            renderUsers(
                users
            );

            return;

        }


        const filtered =
            users.filter(
                user => {

                    const name =
                        String(
                            user.name || ""
                        )
                            .toLowerCase();

                    const email =
                        String(
                            user.email || ""
                        )
                            .toLowerCase();

                    const phone =
                        String(
                            user.phone || ""
                        )
                            .toLowerCase();

                    const id =
                        String(
                            user.id || ""
                        )
                            .toLowerCase();


                    return (

                        name.includes(
                            query
                        ) ||

                        email.includes(
                            query
                        ) ||

                        phone.includes(
                            query
                        ) ||

                        id.includes(
                            query
                        )

                    );

                }
            );


        renderUsers(
            filtered
        );

    }


    // =====================================================
    // SELECT USER
    // =====================================================

    async function selectUser(
        userId
    ) {

        try {

            const data =
                await apiRequest(
                    `/admin/user/${encodeURIComponent(
                        userId
                    )}`
                );


            selectedUser =
                data.user;


            renderUsers(
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    ? users.filter(
                        user => {

                            const q =
                                document
                                    .getElementById(
                                        "searchInput"
                                    )
                                    .value
                                    .toLowerCase();

                            return (

                                String(
                                    user.name || ""
                                )
                                    .toLowerCase()
                                    .includes(
                                        q
                                    ) ||

                                String(
                                    user.email || ""
                                )
                                    .toLowerCase()
                                    .includes(
                                        q
                                    ) ||

                                String(
                                    user.phone || ""
                                )
                                    .toLowerCase()
                                    .includes(
                                        q
                                    ) ||

                                String(
                                    user.id || ""
                                )
                                    .toLowerCase()
                                    .includes(
                                        q
                                    )

                            );

                        }
                    )
                    : users
            );


            renderUserDetails();


        } catch (error) {

            showStatus(
                error.message,
                "error"
            );

        }

    }

    // =====================================================
    // CHANGE TAB
    // =====================================================

    function changeTab(
        tab
    ) {

        currentTab =
            tab;

        renderUserDetails();

    }


    // =====================================================
    // TAB CONTENT
    // =====================================================

    function renderTabContent() {

        const box =
            document.getElementById(
                "tabContent"
            );


        if (!box) {
            return;
        }


        const user =
            selectedUser;


        if (
            currentTab ===
            "deposits"
        ) {

            renderDeposits(
                box,
                user.deposits || []
            );

            return;

        }


        if (
            currentTab ===
            "withdrawals"
        ) {

            renderWithdrawals(
                box,
                user.withdrawals || []
            );

            return;

        }


        if (
            currentTab ===
            "transactions"
        ) {

            renderTransactions(
                box,
                user.transactions || []
            );

            return;

        }


        if (
            currentTab ===
            "trades"
        ) {

            renderTrades(
                box,
                user.trades || []
            );

            return;

        }

    }


    // =====================================================
    // DEPOSITS
    // =====================================================

    function renderDeposits(

    ) {

            !deposits.length
        ) {

            box.innerHTML = `

                <div class="empty">

                    No deposit records.

                </div>

            `;

            return;

        }


        box.innerHTML = `

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>Amount</th>
                            <th>Method</th>
                            <th>Reference</th>
                            <th>Status</th>
                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody>

                        ${
                            deposits
                                .map(
                                    deposit => `

                                        <tr>

                                            <td class="green">

                                                ${money(
                                                    deposit.amount
                                                )}

                                            </td>

                                            <td>

                                                ${escapeHtml(
                                                    deposit.method || "-"
                                                )}

                                            </td>

                                            <td>

                                                ${escapeHtml(
                                                    deposit.reference || "-"
                                                )}

                                            </td>

                                            <td class="${statusClass(
                                                deposit.status
                                            )}">

                                                ${escapeHtml(
                                                    deposit.status || "-"
                                                )}

                                            </td>

                                            <td class="gray">

                                                ${escapeHtml(
                                                    formatDate(
                                                        deposit.createdAt
                                                    )
                                                )}

                                            </td>

                                        </tr>

                                    `

                    </tbody>

                </table>

    // WITHDRAWALS

                            <th>Account</th>
                            <th>Status</th>

                    </thead>

                    <tbody>

                            withdrawals

                                    withdrawal => `

                                        <tr>

                                                ${money(
                                                    withdrawal.amount
                                                )}

                                            </td>

                                            <td>

                                                ${escapeHtml(
                                                    withdrawal.method || "-"
                                                )}

                                            </td>

                                            <td>

                                                ${escapeHtml(
                                                    withdrawal.account || "-"
                                                )}

                                            </td>

                                            <td class="${statusClass(

                                            )}">

                                                    withdrawal.status || "-"
                                                )}

                                            </td>

    // =====================================================
    // TRANSACTIONS
    // =====================================================

    function renderTransactions(

    ) {

                </div>

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>Type</th>
                            <th>Amount</th>
                            <th>Direction</th>
                            <th>Status</th>
                            <th>Description</th>
                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody>

                        ${
                            transactions
                                .map(
                                    transaction => `

                                        <tr>

                                            <td>

                                                ${escapeHtml(
                                                    transaction.type || "-"
                                                )}

                                                )}

    // =====================================================
    // TRADES
    // =====================================================

    function renderTrades(
        box,
        trades
    ) {

        if (
            !trades.length
        ) {

            box.innerHTML = `

                <div class="empty">

                    No trades.

                </div>

            return;

        box.innerHTML = `

            <div class="table-wrap">

                <table>

                            <th>Entry</th>

                            <th>Status</th>

                    </thead>

                    <tbody>

                        ${

                                .map(
                                    trade => `

                                        <tr>

                                            <td>

                                                ${escapeHtml(
                                                    trade.symbol || "-"
                                                )}

                                            </td>

                                            <td class="${
                                                trade.type === "BUY"
                                                    ? "green"
                                                    : "red"
                                            }">

                                                ${escapeHtml(
                                                    trade.type || "-"
                                                )}

                                            </td>

                                                ${money(
                                                    trade.amount
                                                )}

                                            </td>

                                                ${escapeHtml(

    // =====================================================
    // STATUS CLASS
    // =====================================================

    function statusClass(
        status
    ) {

        const value =
            String(
                status || ""
            )
                .toUpperCase();


        if (
            value === "APPROVED" ||
            value === "COMPLETED" ||
            value === "WIN"
        ) {

            return "green";

        }


        if (
            value === "REJECTED" ||
            value === "LOSE" ||
            value === "FAILED"
        ) {

            return "red";

        }


        if (
            value === "PENDING" ||
            value === "SUBMITTED" ||
            value === "OPEN"
        ) {

            return "yellow";

        }


        return "gray";

    }


    // =====================================================
    // ADD BALANCE
    // =====================================================

    async function addBalance() {

        if (!selectedUser) {

            showStatus(
                "Please select a user first.",
                "error"
            );

            return;

        }


        const input =
            document.getElementById(
                "addAmount"
            );


        const amount =
            Number(
                input.value
            );


        if (
            !Number.isFinite(
                amount
            ) ||
            amount <= 0
        ) {

            showStatus(
                "Enter a valid amount.",
                "error"
            );

            return;

        }


        const confirmed =
            window.confirm(

                `Add ${money(
                    amount
                )} to ${selectedUser.name}'s balance?`

            );


        if (!confirmed) {
            return;
        }


        try {

            const data =
                await apiRequest(
                    "/admin/add-balance",
                    {

                        method:
                            "POST",

                        body:
                            JSON.stringify({

                                userId:
                                    selectedUser.id,

                                amount:
                                    amount

                            })

                    }
                );


            selectedUser =
                data.user;


            updateUserInList(
                selectedUser
            );


            updateStats();

            input.value =
                "";


            renderUserDetails();


            showStatus(
                "Balance added successfully.",
                "success"
            );


        } catch (error) {

            showStatus(
                error.message,
                "error"
            );

        }

    }


    // =====================================================
    // REMOVE BALANCE
    // =====================================================

    async function removeBalance() {

        if (!selectedUser) {

            showStatus(
                "Please select a user first.",
                "error"
            );

            return;

        }


        const input =
            document.getElementById(
                "removeAmount"
            );


        const amount =
            Number(
                input.value
            );


        if (
            !Number.isFinite(
                amount
            ) ||
            amount <= 0
        ) {

            showStatus(
                "Enter a valid amount.",
                "error"
            );

            return;

        }


        if (
            amount >
            Number(
                selectedUser.balance || 0
            )
        ) {

            showStatus(
                "Cannot remove more than current balance.",
                "error"
            );

            return;

        }


        const confirmed =
            window.confirm(

                `Remove ${money(
                    amount
                )} from ${selectedUser.name}'s balance?`

            );


        if (!confirmed) {
            return;
        }


        try {

            const data =
                await apiRequest(
                    "/admin/remove-balance",
                    {

                        method:
                            "POST",

                        body:
                            JSON.stringify({

                                userId:
                                    selectedUser.id,

                                amount:
                                    amount

                            })

                    }
                );


            selectedUser =
                data.user;


            updateUserInList(
                selectedUser
            );


            updateStats();

            input.value =
                "";


            renderUserDetails();


            showStatus(
                "Balance removed successfully.",
                "success"
            );


        } catch (error) {

            showStatus(
                error.message,
                "error"
            );

        }

    }


    // =====================================================
    // UPDATE USER IN LIST
    // =====================================================

    function updateUserInList(
        updatedUser
    ) {

        const index =
            users.findIndex(
                user =>
                    String(
                        user.id
                    ) ===
                    String(
                        updatedUser.id
                    )
            );


        if (
            index !== -1
        ) {

            users[index] =
                updatedUser;

        }


        renderUsers(
            users
        );

    }


    // =====================================================
    // REFRESH SELECTED USER
    // =====================================================

    async function refreshSelectedUser() {

        if (!selectedUser) {
            return;
        }


        await selectUser(
            selectedUser.id
        );


        await loadUsers();

        await selectUser(
            selectedUser.id
        );

    }


    // =====================================================
    // ADMIN PANEL
    // =====================================================

    function goBackAdmin() {

        window.location.href =
            "/admin.html";

    }


    // =====================================================
    // LOGOUT
    // =====================================================

    function logoutAdmin() {

        const confirmed =
            window.confirm(
                "Logout from KrakenTech Admin?"
            );


        if (!confirmed) {
            return;
        }


        localStorage.removeItem(
            "tradeXToken"
        );

        localStorage.removeItem(
            "token"
        );

        localStorage.removeItem(
            "authToken"
        );

        localStorage.removeItem(
            "jwtToken"
        );

        localStorage.removeItem(
            "adminToken"
        );

        localStorage.removeItem(
            "tradeXAdminSecret"
        );

        localStorage.removeItem(
            "adminSecret"
        );


        window.location.href =
            "/login.html";

    }


    // =====================================================
    // INITIALIZE
    // =====================================================

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            /*
             * We don't automatically delete credentials.
             * The existing Admin Panel token is used.
             */

            loadUsers();

        }
    );

</script>
