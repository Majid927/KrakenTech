<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="icon" type="image/png" href="logo.png">
    <title>KrakenTech - Signup</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .auth-card {
            background: #111;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 35px;
            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.45);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            color: #ff1f1f;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .auth-logo-img {
            height: 42px;
            width: auto;
            max-width: 50px;
            object-fit: contain;
            border-radius: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;

            background: #191919;
            color: white;

            border: 1px solid #333;
            border-radius: 7px;

            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #ff1f1f;
        }

        .signup-button {
            width: 100%;
            padding: 14px;

            background: #d60000;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .signup-button:hover {
            background: #b80000;
        }

        .signup-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 12px;

            border-radius: 7px;

            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #103d28;
            color: #00ff88;
            border: 1px solid #1b6946;
        }

        .message.error {
            display: block;
            background: #3d1212;
            color: #ff6666;
            border: 1px solid #702222;
        }

        .auth-footer {
            text-align: center;
            color: #888;
            margin-top: 22px;
            font-size: 14px;
        }

        .auth-footer a {
            color: #ff1f1f;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

    
        /* KrakenTech Logo Constraints */
        .logo { display: flex !important; align-items: center !important; gap: 10px !important; color: #ff1f1f !important; font-size: 20px !important; font-weight: 800 !important; letter-spacing: 0.5px !important; text-decoration: none !important; }
        .logo-img, .logo img { height: 32px !important; width: 32px !important; max-height: 32px !important; max-width: 32px !important; object-fit: contain !important; border-radius: 50% !important; flex-shrink: 0 !important; vertical-align: middle !important; display: inline-block !important; }
        .auth-logo { display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 8px !important; color: #ff1f1f !important; font-size: 26px !important; font-weight: 800 !important; margin-bottom: 16px !important; text-decoration: none !important; }
        .auth-logo-img, .auth-logo img { height: 48px !important; width: 48px !important; max-height: 48px !important; max-width: 48px !important; object-fit: contain !important; border-radius: 50% !important; display: block !important; margin: 0 auto !important; }

    </style>

</head>

<body>


<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo"><img src="logo.png" alt="KrakenTech" class="auth-logo-img" onerror="this.style.display='none'"><span>KrakenTech</span></div>


        <div class="auth-subtitle">
            Create your trading account
        </div>


        <form
            id="signupForm"
            autocomplete="on"
        >


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="signup-button"
                id="signupButton"
            >
                Create Account
            </button>


        </form>


        <div
            id="signupMessage"
            class="message"
        ></div>


        <div class="auth-footer">

            Already have an account?

            <a href="/login.html">
                Login
            </a>

        </div>

    </div>

</div>


<script>

const API_URL = (typeof window !== "undefined" && window.location.protocol.startsWith("http"))
    ? window.location.origin
    : "http://localhost:3000";


const signupForm =
    document.getElementById(
        "signupForm"
    );


const signupButton =
    document.getElementById(
        "signupButton"
    );


const signupMessage =
    document.getElementById(
        "signupMessage"
    );


/* =====================================================
   MESSAGE
===================================================== */

function showSignupMessage(
    text,
    type
) {

    signupMessage.textContent =
        text;

    signupMessage.className =
        "message " +
        type;

}


/* =====================================================
   SIGNUP
===================================================== */

signupForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value
            .trim()
            .toLowerCase();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        if (
            !name ||
            !email ||
            !password
        ) {

            showSignupMessage(
                "Please fill in all required fields.",
                "error"
            );

            return;

        }


        if (
            password.length < 6
        ) {

            showSignupMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;

        }


        if (
            password !==
            confirmPassword
        ) {

            showSignupMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        signupButton.disabled =
            true;


        signupButton.textContent =
            "Creating Account...";


        signupMessage.className =
            "message";


        try {

            const response =
                await fetch(

                    API_URL +
                    "/signup",

                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                name:
                                    name,

                                email:
                                    email,

                                phone:
                                    phone,

                                password:
                                    password

                            })

                    }

                );


            let data = {};


            try {

                data =
                    await response.json();

            } catch (error) {

                throw new Error(
                    "Invalid response from server."
                );

            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Unable to create account."

                );

            }


            if (
                !data.token ||
                !data.user ||
                !data.user.id
            ) {

                throw new Error(
                    "Server returned incomplete signup data."
                );

            }


            /*
             * Save JWT.
             */

            localStorage.setItem(
                "tradeXToken",
                data.token
            );


            /*
             * Save User ID.
             */

            localStorage.setItem(
                "currentUserId",
                String(
                    data.user.id
                )
            );


            /*
             * Save user data.
             */

            localStorage.setItem(
                "tradeXUser",
                JSON.stringify(
                    data.user
                )
            );


            /*
             * Login state.
             */

            localStorage.setItem(
                "login",
                "true"
            );


            showSignupMessage(
                "Account created successfully. Opening dashboard...",
                "success"
            );


            /*
             * Redirect to dashboard.
             */

            setTimeout(
                function() {

                    window.location.href =
                        "dashboard.html";

                },
                700
            );


        } catch (error) {

            console.error(
                "Signup error:",
                error
            );


            showSignupMessage(

                error.message ||
                "Unable to connect to backend.",

                "error"

            );

        } finally {

            signupButton.disabled =
                false;

            signupButton.textContent =
                "Create Account";

        }

    }
);

</script>


</body>

</html>
